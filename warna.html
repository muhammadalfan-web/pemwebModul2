<!DOCTYPE html>
<html>
<head>
    <title>Tabel Warna</title>
</head>

<body>

<table border="1" bordercolor="white" cellspacing="0" cellpadding="0">

    <!-- BARIS 1 -->
    <tr height="85">

        <!-- Biru kiri -->
        <td bgcolor="blue" rowspan="7" width="85"></td>

        <!-- Biru atas -->
        <td bgcolor="blue" colspan="3" width="255"></td>

    </tr>


    <!-- BARIS 2 -->
    <tr height="85">

        <!-- Hijau kecil -->
        <td bgcolor="lime" width="85"></td>

        <!-- Hijau besar -->
        <td bgcolor="lime" colspan="2" rowspan="2" width="170"></td>

        <!-- Biru kanan -->
        <td bgcolor="blue" rowspan="2" width="85"></td>

    </tr>


    <!-- BARIS 3 -->
    <tr height="85">

        <!-- Putih -->
        <td></td>

    </tr>


    <!-- BARIS 4 -->
    <tr height="85">

        <!-- Biru bawah kiri -->
        <td bgcolor="blue"></td>

        <!-- Putih tengah -->
        <td></td>

        <!-- Biru bawah kanan -->
        <td bgcolor="blue"></td>

    </tr>


    <!-- BARIS 5 -->
    <tr height="85">

    </tr>


    <!-- BARIS 6 -->
    <tr height="85">

    </tr>


    <!-- BARIS 7 -->
    <tr height="85">

    </tr>

</table>

</body>
</html>
